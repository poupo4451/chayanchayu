<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  苹方（PingFang SC）字体在 Linux 容器里的解析规则
  ==================================================================
  苹方是 Apple 的私有字体，不允许随镜像分发，容器里不可能真的装上它。
  但 CSS 里必须写 'PingFang SC'，这样在 macOS 上做 Remotion Studio 预览时
  才能命中真正的苹方，保证「设计稿 = 预览 = 渲染」。

  为了让容器渲染出来的字形与苹方一致，这里用 fontconfig 把所有苹方家族名
  强制解析到 Noto Sans CJK SC（思源黑体）—— 它与苹方同为现代无衬线黑体，
  字重与字面宽度最接近，替换后气泡内的换行位置几乎不会变化。

  binding="strong" 保证这条别名优先于 CSS 里后续的 fallback 字体。
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>PingFang HK</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>PingFang TC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>

  <!-- CSS 字体栈里 -apple-system / BlinkMacSystemFont 同样指向苹方 -->
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- 无衬线兜底也走思源黑体，避免中文掉成豆腐块 -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
</fontconfig>
